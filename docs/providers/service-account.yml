# A service account with the minimum permissions required to use the kubernetes-pod provider
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elastic-machines
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elastic-machines
rules:
  - apiGroups: [""] # "" indicates the core API group
    resources: [namespaces]
    verbs: [create, get, patch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, delete, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elastic-machines
subjects:
  - kind: ServiceAccount
    name: elastic-machines
    namespace: default
roleRef:
  kind: ClusterRole
  name: elastic-machines
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: elastic-machines
  annotations:
    kubernetes.io/service-account.name: elastic-machines
type: kubernetes.io/service-account-token
